# HTWOS platform profile - Rockchip RK3588
id: rk3588
soc: RK3588
vendor: rockchip
kernel: "TBD"          # fill with verified kernel version
bsp: "TBD"             # vendor BSP version
npu:
  backends: ["rknn"]
gpu:
  notes: "Mali-G610 class (board dependent)"
